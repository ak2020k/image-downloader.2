<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { width: 360px; margin: 0; font: 13px system-ui, sans-serif; color: #222; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; border-bottom: 1px solid #ddd;
  }
  #status { font-weight: 600; }
  header a { color: #4a76a8; cursor: pointer; font-size: 12px; }

  #progress { padding: 8px 10px; border-bottom: 1px solid #eee; }
  .progress-phases { display: flex; gap: 6px; margin-bottom: 7px; }
  .phase-step {
    font-size: 10px; padding: 2px 9px; border-radius: 10px;
    background: #e4e7eb; color: #999; transition: all 0.3s ease;
  }
  .phase-step.active { background: #4a76a8; color: #fff; }
  .phase-step.done { background: #d4e6d4; color: #2a7a2a; }
  .progress-label {
    font-size: 11px; color: #555; margin-bottom: 5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .progress-percent { font-weight: 700; color: #4a76a8; font-size: 12px; }
  .progress-track { width: 100%; height: 7px; background: #e4e7eb; border-radius: 4px; overflow: hidden; }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4a76a8, #5d8fc4);
    border-radius: 4px; transition: width 0.3s ease;
  }
  .progress-fill.indeterminate { width: 30%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
  }
  .progress-stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: #666; margin-top: 6px; }
  .stat-found { color: #2a7a2a; font-weight: 600; }
  .stat-fallback { color: #c07a2a; font-weight: 600; }
  .stat-eta { color: #999; margin-left: auto; }
  .progress-current {
    font-size: 10px; color: #aaa; margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #list { max-height: 260px; overflow-y: auto; padding: 4px 0; }
  .item { display: flex; align-items: center; gap: 8px; padding: 4px 10px; }
  .item:hover { background: #f2f6fb; }
  .item img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; background: #eee; flex: 0 0 auto; }
  .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }

  footer { padding: 8px 10px; border-top: 1px solid #ddd; }
  button {
    width: 100%; padding: 6px 10px; border: 0; border-radius: 4px;
    background: #4a76a8; color: #fff; font: inherit; cursor: pointer;
  }
  button:disabled { background: #9db6d2; cursor: default; }
  #message { padding: 12px 10px; }

  #downloads-view { max-height: 330px; overflow-y: auto; }
  .dl-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; border-bottom: 1px solid #eee;
    font-size: 11px; color: #666; position: sticky; top: 0; background: #fff;
  }
  .dl-header a { color: #4a76a8; cursor: pointer; }
  .dl-item { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid #f5f5f5; }
  .dl-icon { flex: 0 0 auto; width: 16px; text-align: center; font-size: 12px; }
  .dl-icon.ok { color: #2a7a2a; }
  .dl-icon.run { color: #4a76a8; }
  .dl-icon.err { color: #cc2a2a; }
  .dl-name { flex: 1 1 auto; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dl-bar { flex: 0 0 60px; height: 5px; background: #e4e7eb; border-radius: 3px; overflow: hidden; }
  .dl-bar-fill { height: 100%; background: #4a76a8; }
  .dl-size { flex: 0 0 auto; font-size: 10px; color: #999; }
  .dl-note { font-size: 10px; color: #aaa; padding: 6px 10px; }

  #confirm-view { padding: 18px 14px; }
  .confirm-box { text-align: center; }
  .confirm-icon { font-size: 30px; margin-bottom: 10px; }
  .confirm-message { font-size: 13px; color: #333; margin-bottom: 16px; line-height: 1.4; }
  .confirm-actions { display: flex; flex-direction: column; gap: 7px; }
  .confirm-actions button { width: 100%; padding: 8px 10px; border: 0; border-radius: 4px; font: inherit; cursor: pointer; }
  .confirm-actions button.primary { background: #4a76a8; color: #fff; }
  .confirm-actions button.secondary { background: #e8eef5; color: #333; }
  .confirm-actions button.ghost { background: transparent; color: #999; }

  #debug-line { font-size: 10px; color: #bbb; padding: 3px 10px; border-top: 1px solid #eee; }
</style>
</head>
<body>
  <header>
    <span id="status">Сканирую…</span>
    <span><a id="select-all">все</a> · <a id="select-none">ничего</a> · <a id="show-downloads">загрузки</a> · <a id="copy-diag">диагностика</a></span>
  </header>

  <div id="main-view">
    <div id="progress" hidden>
      <div class="progress-phases">
        <span class="phase-step" id="phase-step-1">1. Сайт ищет фото</span>
        <span class="phase-step" id="phase-step-2">2. Догрузка</span>
      </div>
      <div class="progress-label">
        <span id="progress-text">Сканирую страницу…</span>
        <span class="progress-percent" id="progress-percent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-stats">
        <span id="stat-count">0 из 0</span>
        <span class="stat-found" id="stat-found"></span>
        <span class="stat-fallback" id="stat-fallback"></span>
        <span class="stat-eta" id="stat-eta"></span>
      </div>
      <div class="progress-current" id="progress-current"></div>
    </div>

    <div id="list"></div>
    <div id="message" hidden></div>
    <footer><button id="download" disabled>Скачать</button></footer>
  </div>

  <div id="downloads-view" hidden>
    <div class="dl-header">
      <a id="back-to-main">← назад</a>
      <span id="dl-summary"></span>
    </div>
    <div id="downloads-list"></div>
    <div class="dl-note">Файлы также видны в стандартной панели загрузок Firefox (Ctrl+J)</div>
  </div>

  <div id="confirm-view" hidden>
    <div class="confirm-box">
      <div class="confirm-icon">📁</div>
      <div class="confirm-message" id="confirm-message"></div>
      <div class="confirm-actions" id="confirm-actions"></div>
    </div>
  </div>

  <div id="debug-line"></div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
